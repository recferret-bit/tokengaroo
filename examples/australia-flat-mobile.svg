<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="australia background" data-horizon="1040" data-landmark="uluru">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fcf"/><stop offset="1" stop-color="#fbd9a6"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd9a6"/><stop offset="1" stop-color="#fbd9a6"/></linearGradient>
</defs>
<style>
  @keyframes cloud { from { transform: translateX(-400px) } to { transform: translateX(1000px) } }
  .cloud { animation: cloud 120s linear infinite }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .halo { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite }
  @keyframes fly { from { transform: translateX(-120px) } to { transform: translateX(1020px) } }
  .bird { animation: fly 45s linear infinite }
  @keyframes roo-run { 0% { transform: translateX(-200px) } 60%, 100% { transform: translateX(1100px) } }
  @keyframes hop {
    0%, 100% { transform: translateY(0) rotate(5deg); animation-timing-function: ease-out }
    50% { transform: translateY(-36px) rotate(-6deg); animation-timing-function: ease-in }
  }
  @keyframes dust {
    0% { transform: translateX(0) scale(.3); opacity: 0 }
    10% { opacity: .85 }
    100% { transform: translateX(-33.9px) scale(1.6); opacity: 0 }
  }
  .roo-run { animation: roo-run 40s linear infinite }
  .roo-hop { transform-box: fill-box; transform-origin: center; animation: hop .75s infinite }
  .dust { transform-box: fill-box; transform-origin: 50% 100%; animation: dust .75s ease-out infinite }
  @media (prefers-reduced-motion: reduce) { .dust { opacity: 0 } }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg) } 50% { transform: rotate(2.5deg) } }
  .crown { animation: sway 5s ease-in-out infinite }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
