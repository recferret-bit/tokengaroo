<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="moscow background" data-horizon="1040" data-landmark="stBasils">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f6fa8"/><stop offset="1" stop-color="#f4c7a6"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c7a6"/><stop offset="1" stop-color="#f4c7a6"/></linearGradient>
</defs>
<style>
  @keyframes cloud { from { transform: translateX(-400px) } to { transform: translateX(1000px) } }
  .cloud { animation: cloud 120s linear infinite }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .halo { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite }
  @keyframes fly { from { transform: translateX(-120px) } to { transform: translateX(1020px) } }
  .bird { animation: fly 45s linear infinite }
  @keyframes fall { from { transform: translateY(-20px) } to { transform: translateY(1620px) } }
  @keyframes flutter { from { transform: translateX(-8px) } to { transform: translateX(8px) } }
  .flake { animation: fall 20s linear infinite }
  .flutter { animation: flutter 3s ease-in-out infinite alternate }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
