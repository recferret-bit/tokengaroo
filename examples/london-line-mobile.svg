<style>
  @keyframes cloud { from { transform: translateX(-400px) } to { transform: translateX(1000px) } }
  .cloud { animation: cloud 120s linear infinite }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .halo { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite }
  @keyframes fly { from { transform: translateX(-120px) } to { transform: translateX(1020px) } }
  .bird { animation: fly 45s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  .wheel { animation: spin 160s linear infinite }
  @keyframes drift { from { transform: translateX(-30px) } to { transform: translateX(30px) } }
  .wave { animation: drift 6s ease-in-out infinite alternate }
  @keyframes bus-drive { 0% { transform: translateX(-220px) } 50%, 100% { transform: translateX(1120px) } }
  .bus-drive { animation: bus-drive 44s linear infinite }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
