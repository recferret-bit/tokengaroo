<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="washington background" data-horizon="1040" data-landmark="capitol">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa8dc"/><stop offset="1" stop-color="#fbd7b8"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7c9e6"/><stop offset="1" stop-color="#5e8fbf"/></linearGradient>
</defs>
<style>
  @keyframes cloud { from { transform: translateX(-400px) } to { transform: translateX(1000px) } }
  .cloud { animation: cloud 120s linear infinite }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .halo { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite }
  @keyframes fly { from { transform: translateX(-120px) } to { transform: translateX(1020px) } }
  .bird { animation: fly 45s linear infinite }
  @keyframes drift { from { transform: translateX(-30px) } to { transform: translateX(30px) } }
  .wave { animation: drift 6s ease-in-out infinite alternate }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg) } 50% { transform: rotate(2.5deg) } }
  .crown { animation: sway 5s ease-in-out infinite }
  @keyframes petal { 0% { transform: translate(0, 0) rotate(0); opacity: 0 } 15% { opacity: .9 } 100% { transform: translate(-70px, 150px) rotate(240deg); opacity: 0 } }
  .petal { transform-box: fill-box; transform-origin: center; animation: petal 7s ease-in infinite }
  @media (prefers-reduced-motion: reduce) { .petal { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
