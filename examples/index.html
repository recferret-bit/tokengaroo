<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region backgrounds</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 14px/1.4 system-ui, sans-serif; background: #f4f1ec; color: #222 }
  h1 { margin: 0 0 8px } h2 { margin: 32px 0 12px; font-weight: 600; text-transform: capitalize }
  .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap }
  figure { margin: 0 } figcaption { margin-top: 6px; color: #777; font: 12px ui-monospace, monospace }
  img { display: block; max-width: 100%; box-shadow: 0 2px 12px #0002 }
  .desktop { width: 720px; aspect-ratio: 16 / 9; border-radius: 10px }
  .mobile { width: 228px; aspect-ratio: 9 / 16; border-radius: 26px }
</style>
<h1>Region backgrounds</h1>

  <section>
    <h2>thailand · flat</h2>
    <div class="row">
      <figure><img class="desktop" src="thailand-flat-desktop.svg" alt="thailand · flat, desktop"><figcaption>thailand-flat-desktop.svg</figcaption></figure>
      <figure><img class="mobile" src="thailand-flat-mobile.svg" alt="thailand · flat, mobile"><figcaption>thailand-flat-mobile.svg</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>thailand · line</h2>
    <div class="row">
      <figure><img class="desktop" src="thailand-line-desktop.svg" alt="thailand · line, desktop"><figcaption>thailand-line-desktop.svg</figcaption></figure>
      <figure><img class="mobile" src="thailand-line-mobile.svg" alt="thailand · line, mobile"><figcaption>thailand-line-mobile.svg</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>australia · flat</h2>
    <div class="row">
      <figure><img class="desktop" src="australia-flat-desktop.svg" alt="australia · flat, desktop"><figcaption>australia-flat-desktop.svg</figcaption></figure>
      <figure><img class="mobile" src="australia-flat-mobile.svg" alt="australia · flat, mobile"><figcaption>australia-flat-mobile.svg</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>australia · line</h2>
    <div class="row">
      <figure><img class="desktop" src="australia-line-desktop.svg" alt="australia · line, desktop"><figcaption>australia-line-desktop.svg</figcaption></figure>
      <figure><img class="mobile" src="australia-line-mobile.svg" alt="australia · line, mobile"><figcaption>australia-line-mobile.svg</figcaption></figure>
    </div>
  </section>
